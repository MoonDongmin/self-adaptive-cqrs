[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name           tcp
    Listen         0.0.0.0
    Port           5170
    Tag            log-events
    Format         json
    Chunk_Size     32
    Buffer_Size    64

[OUTPUT]
    Name           kafka
    Match          *
    Brokers        kafka1:9092,kafka2:9092,kafka3:9092
    Topics         log-events
    Format         json