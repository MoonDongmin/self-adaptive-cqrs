[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name           tail
    Path           /logs/log.json
    Tag            log-events
    Read_from_Head On
    Parser         json

[OUTPUT]
    Name           kafka
    Match          *
    Brokers        kafka1:9092,kafka2:9092,kafka3:9092
    Topics         log-events
    Format         json