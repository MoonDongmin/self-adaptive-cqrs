<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="a4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33557a"/>
    </marker>
    <marker id="a4g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect width="920" height="480" fill="#ffffff"/>

  <!-- region: context engineering -->
  <rect x="20" y="40" width="290" height="330" rx="12" fill="#fafbfc" stroke="#999" stroke-width="1.1" stroke-dasharray="7 5"/>
  <text x="165" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#666">컨텍스트 엔지니어링 (2.3.1)</text>

  <!-- context sources -->
  <text x="95" y="86" text-anchor="middle" font-size="11" fill="#777">컨텍스트 소스</text>
  <g font-size="12" fill="#333">
    <rect x="40" y="94" width="110" height="34" rx="6" fill="#ffffff" stroke="#555"/>
    <text x="95" y="116" text-anchor="middle">로그 · 메트릭</text>
    <rect x="40" y="138" width="110" height="34" rx="6" fill="#ffffff" stroke="#555"/>
    <text x="95" y="160" text-anchor="middle">스키마 · 메타데이터</text>
    <rect x="40" y="182" width="110" height="34" rx="6" fill="#ffffff" stroke="#555"/>
    <text x="95" y="204" text-anchor="middle">소스 코드</text>
    <rect x="40" y="226" width="110" height="34" rx="6" fill="#ffffff" stroke="#555"/>
    <text x="95" y="248" text-anchor="middle">과거 사례(검색)</text>
  </g>

  <!-- assembly -->
  <rect x="180" y="120" width="110" height="96" rx="8" fill="#eef2f7" stroke="#33557a" stroke-width="1.5"/>
  <text x="235" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#33557a">컨텍스트 조립</text>
  <text x="235" y="172" text-anchor="middle" font-size="11" fill="#556">선별 · 구조화</text>
  <text x="235" y="190" text-anchor="middle" font-size="11" fill="#556">프롬프트 주입</text>
  <g stroke="#555" stroke-width="1.2" fill="none">
    <path d="M 150 111 L 178 150" marker-end="url(#a4)"/>
    <path d="M 150 155 L 178 162" marker-end="url(#a4)"/>
    <path d="M 150 199 L 178 174" marker-end="url(#a4)"/>
    <path d="M 150 243 L 178 186" marker-end="url(#a4)"/>
  </g>
  <text x="165" y="330" text-anchor="middle" font-size="11" fill="#777">인컨텍스트 학습 · RAG ·</text>
  <text x="165" y="346" text-anchor="middle" font-size="11" fill="#777">스키마 링킹</text>

  <!-- region: agent -->
  <rect x="330" y="40" width="300" height="330" rx="12" fill="#fafbfc" stroke="#999" stroke-width="1.1" stroke-dasharray="7 5"/>
  <text x="480" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#666">LLM 에이전트 (2.3.2)</text>

  <!-- assembly -> agent -->
  <path d="M 290 168 L 372 168" fill="none" stroke="#33557a" stroke-width="1.6" marker-end="url(#a4b)"/>
  <text x="331" y="158" text-anchor="middle" font-size="10.5" fill="#33557a">컨텍스트</text>

  <!-- agent loop: three nodes -->
  <rect x="380" y="112" width="90" height="44" rx="22" fill="#eef2f7" stroke="#33557a" stroke-width="1.5"/>
  <text x="425" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#33557a">추론</text>
  <rect x="490" y="112" width="120" height="44" rx="22" fill="#eef2f7" stroke="#33557a" stroke-width="1.5"/>
  <text x="550" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#33557a">행동</text>
  <text x="550" y="148" text-anchor="middle" font-size="10.5" fill="#556">도구 호출</text>
  <rect x="435" y="196" width="90" height="44" rx="22" fill="#eef2f7" stroke="#33557a" stroke-width="1.5"/>
  <text x="480" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#33557a">관측</text>

  <g stroke="#33557a" stroke-width="1.5" fill="none">
    <path d="M 470 134 L 486 134" marker-end="url(#a4b)"/>
    <path d="M 540 156 C 530 180, 520 190, 510 200" marker-end="url(#a4b)"/>
    <path d="M 445 200 C 435 185, 428 172, 424 160" marker-end="url(#a4b)"/>
  </g>
  <text x="590" y="188" text-anchor="middle" font-size="10.5" fill="#556">결과</text>
  <text x="404" y="188" text-anchor="middle" font-size="10.5" fill="#556">반영</text>

  <!-- tools -->
  <rect x="360" y="266" width="240" height="60" rx="8" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <text x="480" y="288" text-anchor="middle" font-size="12" font-weight="600" fill="#444">도구(Tools)</text>
  <text x="480" y="308" text-anchor="middle" font-size="11" fill="#666">DB 조회 · 코드 검색 · 실행/검증 · 자기 수정</text>
  <path d="M 480 240 L 480 262" fill="none" stroke="#555" stroke-width="1.2" marker-start="url(#a4)" marker-end="url(#a4)"/>
  <text x="480" y="350" text-anchor="middle" font-size="11" fill="#777">ReAct: 추론–행동 교차 반복</text>

  <!-- region: verification & approval -->
  <rect x="650" y="40" width="250" height="330" rx="12" fill="#fafbfc" stroke="#999" stroke-width="1.1" stroke-dasharray="7 5"/>
  <text x="775" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#666">검증과 승인</text>

  <path d="M 610 134 L 690 134" fill="none" stroke="#33557a" stroke-width="1.6" marker-end="url(#a4b)"/>

  <rect x="695" y="100" width="160" height="66" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <text x="775" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#333">산출물</text>
  <text x="775" y="143" text-anchor="middle" font-size="11" fill="#666">분석 결과 · 코드/DDL</text>
  <text x="775" y="158" text-anchor="middle" font-size="11" fill="#666">권고 문서</text>

  <path d="M 775 166 L 775 190" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#a4)"/>
  <rect x="695" y="194" width="160" height="44" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <text x="775" y="212" text-anchor="middle" font-size="12.5" font-weight="600" fill="#333">자동 검증</text>
  <text x="775" y="228" text-anchor="middle" font-size="10.5" fill="#666">실행 · 문법/스키마 검사</text>

  <path d="M 775 238 L 775 262" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#a4)"/>
  <rect x="695" y="266" width="160" height="44" rx="8" fill="#faf1f0" stroke="#a2453f" stroke-width="1.4"/>
  <text x="775" y="284" text-anchor="middle" font-size="12.5" font-weight="600" fill="#a2453f">👤 사람의 승인</text>
  <text x="775" y="300" text-anchor="middle" font-size="10.5" fill="#7a4a46">human-in-the-loop</text>

  <path d="M 775 310 L 775 334" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#a4)"/>
  <text x="775" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#333">관리 대상 시스템에 적용</text>

  <!-- feedback: knowledge update -->
  <path d="M 850 352 L 880 352 L 880 400 L 95 400 L 95 266" fill="none" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#a4g)"/>
  <text x="480" y="424" text-anchor="middle" font-size="11.5" fill="#666">적용 결과의 지식 갱신 → 다음 적응의 컨텍스트로 순환</text>
</svg>
