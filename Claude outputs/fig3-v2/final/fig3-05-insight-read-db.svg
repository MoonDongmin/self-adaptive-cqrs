<text x="470" y="56" text-anchor="start" font-size="10" fill="#333" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK KR',monospace">## ReadModel: read_multimodal</text>
<text x="470" y="71" text-anchor="start" font-size="10" fill="#333" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK KR',monospace">용도: 장면별 2D이미지·비디오 미디어 링크 조회</text>
<text x="470" y="86" text-anchor="start" font-size="10" fill="#333" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK KR',monospace">키: (scene_key, attempt_num)</text>
<text x="470" y="101" text-anchor="start" font-size="10" fill="#333" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK KR',monospace">```mschema</text>
<text x="470" y="116" text-anchor="start" font-size="10" fill="#333" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK KR',monospace"># Table: read_multimodal</text>
<text x="470" y="131" text-anchor="start" font-size="10" fill="#333" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK KR',monospace">[</text>
<text x="470" y="146" text-anchor="start" font-size="10" fill="#333" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK KR',monospace">(scene_key:varchar, 장면 식별 키, Primary Key, Examples: [반려동물용품_CR01_…_00018]),</text>
<text x="470" y="161" text-anchor="start" font-size="10" fill="#333" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK KR',monospace">(attempt_num:smallint, 같은 장면 내 파지 시도 번호, Primary Key, Examples: [1]),</text>
<text x="470" y="176" text-anchor="start" font-size="10" fill="#333" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK KR',monospace">(occurred_at:timestamptz, 데이터 촬영 일자, Examples: [2023-09-23T00:00:00Z]),</text>
<text x="470" y="191" text-anchor="start" font-size="10" fill="#333" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK KR',monospace">(image_2d_file_name:varchar, 원천 2D 이미지 파일명 (payload.2D_image_file_name)),</text>
<text x="470" y="206" text-anchor="start" font-size="10" fill="#333" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK KR',monospace">(video_file_name:varchar, 원천 비디오 파일명 (시도 번호 자리가 항상 00)),</text>
<text x="470" y="221" text-anchor="start" font-size="10" fill="#333" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK KR',monospace">…</text>
<text x="470" y="236" text-anchor="start" font-size="10" fill="#333" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK KR',monospace">]</text>
<text x="470" y="251" text-anchor="start" font-size="10" fill="#333" font-family="'SF Mono','Menlo','Consolas','Noto Sans Mono CJK KR',monospace">```</text>
