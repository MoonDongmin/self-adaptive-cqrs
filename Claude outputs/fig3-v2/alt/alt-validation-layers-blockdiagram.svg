<text x="38" y="364" font-size="13" font-weight="600" fill="#777">원칙 — LLM은 '어떤 컬럼을 왜'(설계 판단)만 내고, 실행 가능성은 결정론이 보장한다</text>
<text x="40" y="392" text-anchor="start" font-size="10.5" fill="#333" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">① ~ ③ : 형태·문체·실행 가능성을 생성 시점에 실측 (그럴듯하지만 실행되지 않는 SQL, payload에 없는 키를 읽는 프로젝터를 여기서 잡는다)</text>
<text x="40" y="412" text-anchor="start" font-size="10.5" fill="#333" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">④ ~ ⑥ : 입력에 실재하지 않는 값을 걷어내고, 남은 결함은 검증된 fields·keyColumns로부터 템플릿 합성 (유도 불가 컬럼은 null + TODO — 값을 발명하지 않음)</text>
<text x="40" y="432" text-anchor="start" font-size="10.5" fill="#333" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">⑦ : 문서 수준 계약(front-matter · 3절 · Guardrails · 인용 앵커 · 예산)은 위반을 기록만 하며, 재실행은 사람의 판단에 맡긴다</text>
