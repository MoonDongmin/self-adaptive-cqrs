<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a2453f"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>

  <!-- trigger inputs -->
  <rect x="40" y="40" width="230" height="66" rx="8" fill="#faf1f0" stroke="#a2453f" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="155" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#a2453f">변화 신호</text>
  <text x="155" y="86" text-anchor="middle" font-size="11.5" fill="#7a4a46">새 조회 요구 · 스키마 미정의 필드 유입</text>
  <path d="M 155 106 L 155 168" fill="none" stroke="#a2453f" stroke-width="1.4" marker-end="url(#arrowRed)"/>

  <!-- stage: 생성 -->
  <rect x="60" y="172" width="190" height="120" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="155" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#333">① 생성</text>
  <g font-size="11.5" fill="#555">
    <text x="155" y="220" text-anchor="middle">요구 해석 · 스키마 설계</text>
    <text x="155" y="238" text-anchor="middle">DDL 작성</text>
    <text x="155" y="256" text-anchor="middle">프로젝션 로직 구현</text>
    <text x="155" y="274" text-anchor="middle">API 버전 관리</text>
  </g>

  <!-- stage: 운영 -->
  <rect x="345" y="172" width="190" height="120" rx="10" fill="#eef2f7" stroke="#33557a" stroke-width="1.5"/>
  <text x="440" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#33557a">② 운영</text>
  <g font-size="11.5" fill="#556">
    <text x="440" y="224" text-anchor="middle">프로젝션으로 이벤트 반영</text>
    <text x="440" y="242" text-anchor="middle">조회 응답</text>
    <text x="440" y="260" text-anchor="middle">(자동 · 정상 상태)</text>
  </g>

  <!-- stage: 진화 -->
  <rect x="630" y="172" width="190" height="120" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="725" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#333">③ 진화</text>
  <g font-size="11.5" fill="#555">
    <text x="725" y="220" text-anchor="middle">요구 변화 감지·해석</text>
    <text x="725" y="238" text-anchor="middle">스키마 변경 설계</text>
    <text x="725" y="256" text-anchor="middle">호환성 전략 결정</text>
    <text x="725" y="274" text-anchor="middle">(업캐스팅·약한 스키마 등)</text>
  </g>

  <!-- stage: 재생성 -->
  <rect x="345" y="350" width="190" height="80" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="440" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#333">④ 재생성</text>
  <text x="440" y="400" text-anchor="middle" font-size="11.5" fill="#555">이벤트 전체 재생(replay)으로</text>
  <text x="440" y="416" text-anchor="middle" font-size="11.5" fill="#555">Read Model 재생성</text>

  <!-- flow arrows -->
  <path d="M 250 232 L 340 232" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M 535 232 L 625 232" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="580" y="220" text-anchor="middle" font-size="11.5" fill="#666">변화 발생</text>
  <path d="M 725 292 L 725 390 L 540 390" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="648" y="378" text-anchor="middle" font-size="11.5" fill="#666">대규모 변경 시</text>
  <path d="M 440 350 L 440 297" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="487" y="330" text-anchor="middle" font-size="11.5" fill="#666">운영 복귀</text>

  <!-- manual badges -->
  <g font-size="11.5" font-weight="700">
    <rect x="97" y="158" width="116" height="24" rx="12" fill="#a2453f"/>
    <text x="155" y="174.5" text-anchor="middle" fill="#ffffff">👤 개발자 수작업</text>
    <rect x="667" y="158" width="116" height="24" rx="12" fill="#a2453f"/>
    <text x="725" y="174.5" text-anchor="middle" fill="#ffffff">👤 개발자 수작업</text>
    <rect x="382" y="336" width="116" height="24" rx="12" fill="#a2453f"/>
    <text x="440" y="352.5" text-anchor="middle" fill="#ffffff">👤 개발자 수작업</text>
  </g>

  <!-- bottleneck note -->
  <text x="155" y="330" text-anchor="middle" font-size="12" fill="#a2453f" font-weight="600">수동 스키마 진화 병목:</text>
  <text x="155" y="348" text-anchor="middle" font-size="11.5" fill="#7a4a46">①③④ 전이가 전문 개발자의</text>
  <text x="155" y="364" text-anchor="middle" font-size="11.5" fill="#7a4a46">판단과 수작업에 의존</text>
</svg>
