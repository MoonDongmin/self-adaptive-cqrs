<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33557a"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="880" height="520" fill="#ffffff"/>

  <!-- managing system boundary -->
  <rect x="70" y="30" width="740" height="310" rx="14" fill="#fafbfc" stroke="#999" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="92" y="56" font-size="13" font-weight="600" fill="#777">관리 시스템 (Managing System) — MAPE-K 루프</text>

  <!-- Monitor -->
  <rect x="110" y="120" width="150" height="70" rx="10" fill="#eef2f7" stroke="#33557a" stroke-width="1.6"/>
  <text x="185" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#33557a">Monitor</text>
  <text x="185" y="172" text-anchor="middle" font-size="11.5" fill="#556">관측 데이터 수집</text>

  <!-- Analyze -->
  <rect x="310" y="80" width="150" height="70" rx="10" fill="#eef2f7" stroke="#33557a" stroke-width="1.6"/>
  <text x="385" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#33557a">Analyze</text>
  <text x="385" y="132" text-anchor="middle" font-size="11.5" fill="#556">적응 필요성 판단</text>

  <!-- Plan -->
  <rect x="510" y="80" width="150" height="70" rx="10" fill="#eef2f7" stroke="#33557a" stroke-width="1.6"/>
  <text x="585" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#33557a">Plan</text>
  <text x="585" y="132" text-anchor="middle" font-size="11.5" fill="#556">대응 방안 수립</text>

  <!-- Execute -->
  <rect x="620" y="120" width="150" height="70" rx="10" fill="#eef2f7" stroke="#33557a" stroke-width="1.6"/>
  <text x="695" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#33557a">Execute</text>
  <text x="695" y="172" text-anchor="middle" font-size="11.5" fill="#556">적응 행동 적용</text>

  <!-- Knowledge -->
  <rect x="355" y="210" width="170" height="76" rx="38" fill="#fff8e8" stroke="#a0812f" stroke-width="1.6"/>
  <text x="440" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#8a6d1f">Knowledge</text>
  <text x="440" y="264" text-anchor="middle" font-size="11.5" fill="#8a7440">공유 지식 베이스</text>

  <!-- loop arrows -->
  <path d="M 245 118 C 265 100, 285 96, 305 104" fill="none" stroke="#33557a" stroke-width="1.7" marker-end="url(#arrow3)"/>
  <path d="M 460 112 L 505 112" fill="none" stroke="#33557a" stroke-width="1.7" marker-end="url(#arrow3)"/>
  <path d="M 645 118 C 660 122, 668 126, 675 132" fill="none" stroke="#33557a" stroke-width="1.7" marker-end="url(#arrow3)"/>

  <!-- knowledge links -->
  <g stroke="#a0812f" stroke-width="1.1" stroke-dasharray="4 4" fill="none">
    <path d="M 220 190 L 368 224"/>
    <path d="M 388 152 L 420 206"/>
    <path d="M 578 152 L 505 210"/>
    <path d="M 668 192 L 528 240"/>
  </g>

  <!-- managed system -->
  <rect x="200" y="400" width="480" height="80" rx="12" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/>
  <text x="440" y="432" text-anchor="middle" font-size="15" font-weight="700" fill="#444">관리 대상 시스템 (Managed System)</text>
  <text x="440" y="456" text-anchor="middle" font-size="12" fill="#666">예: 이벤트 소싱·CQRS 기반 데이터 계층</text>

  <!-- sensor / effector -->
  <path d="M 260 400 L 190 195 " fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <rect x="150" y="290" width="96" height="26" rx="13" fill="#ffffff" stroke="#555"/>
  <text x="198" y="307.5" text-anchor="middle" font-size="12" fill="#444">센서(Sensor)</text>

  <path d="M 692 195 L 625 400" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <rect x="630" y="290" width="110" height="26" rx="13" fill="#ffffff" stroke="#555"/>
  <text x="685" y="307.5" text-anchor="middle" font-size="12" fill="#444">실행기(Effector)</text>
</svg>
